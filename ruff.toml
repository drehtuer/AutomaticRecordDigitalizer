# Static checks for the CadQuery model, the motion planner and the collision checker.
# Run from the repository root: ruff check .
target-version = "py311"
line-length = 100
indent-width = 4

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import sorting
  "UP",  # pyupgrade
  "B",   # bugbear
]
ignore = [
  "E501",  # the dimension tables in cad/params.py read better as long lines
]
