name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: |
          python -m pip install --only-binary :all: ruff==0.16.6

      - name: Lint
        run: ruff check --output-format=github .

  markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install markdownlint-cli2
        run: npm install --global --ignore-scripts markdownlint-cli2@0.23.2

      - name: Lint
        run: markdownlint-cli2

  collisions:
    name: collision check
    runs-on: ubuntu-latest
    # The full cycle is 831 samples and takes about a minute and a half.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cad/requirements.txt

      - name: Install the OpenCascade system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libxi6 libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install CadQuery
        run: |
          python -m pip install --only-binary :all: --require-hashes -r cad/requirements.txt

      - name: Sweep the cycle for collisions
        run: python -m cad.check_collisions

  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    # Pull requests from forks and from Dependabot are not given SONAR_TOKEN.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the blame data behind new-code detection
          persist-credentials: false

      # Pinned to a commit, because this action is handed the token. Dependabot updates it.
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
