name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python -m pip install ruff==0.16.6

      - name: Lint
        run: ruff check --output-format=github .

  markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Lint
        run: npx --yes markdownlint-cli2@0.23.2

  collisions:
    name: collision check
    runs-on: ubuntu-latest
    # The full cycle is 831 samples and takes about a minute and a half.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cad/requirements.txt

      - name: Install the OpenCascade system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libxi6 libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install CadQuery
        run: python -m pip install -r cad/requirements.txt

      - name: Sweep the cycle for collisions
        run: python -m cad.check_collisions
