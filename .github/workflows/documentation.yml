name: Documentation

# The documentation site is published when a release tag is pushed,
# and on demand from the Actions tab.
#
# This needs one setting that does not live in the repository: the github-pages
# environment must allow deployments from tags. It ships allowing the default
# branch only, so the build succeeds and the deploy is rejected with
#
#     Tag "v0.1.0" is not allowed to deploy to github-pages
#     due to environment protection rules.
#
# Settings > Environments > github-pages > Deployment branches and tags, add the
# tag rule v*, or:
#
#     gh api --method POST \
#       repos/OWNER/REPO/environments/github-pages/deployment-branch-policies \
#       -f name='v*' -f type='tag'
#
# Switching the trigger to the release event does not avoid this: a release runs
# on the tag ref too, and is rejected the same way.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes of the site overlap, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build with Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
